name: CSG - extrair relatorio executivo para revisao
on:
  push:
    branches: [master]
    paths:
      - .github/workflows/csg-extrair-relatorio.yml
permissions:
  contents: write
jobs:
  extrair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar leitor de PDF
        run: pip install pymupdf==1.26.5
      - name: Extrair texto original
        run: |
          python -c "import fitz; p='clientes/credit-578/levantamento-financeiro/'; d=fitz.open(p+'Relatorio_Executivo_CSG.pdf'); open(p+'_Relatorio_Original_Texto_CSG.txt','w').write('\\n'.join(pg.get_text(sort=True) for pg in d))"
          wc -l clientes/credit-578/levantamento-financeiro/_Relatorio_Original_Texto_CSG.txt
      - name: Publicar fonte para revisao
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clientes/credit-578/levantamento-financeiro/_Relatorio_Original_Texto_CSG.txt
          if ! git diff --cached --quiet; then git commit -m "docs(csg): extrair texto do relatorio original para revisao executiva"; git push; fi

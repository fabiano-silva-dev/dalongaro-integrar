name: Publicar defesa EMAL em DOCX e PDF
on:
  push:
    branches: [master]
    paths:
      - .github/workflows/publicar-defesa-emal.yml
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Baixar e validar documentos
        shell: bash
        run: |
          set -euo pipefail
          cd clientes/luciano-664
          curl -fL --retry 3 --connect-timeout 15 -A "Mozilla/5.0" \
            "https://drive.google.com/uc?export=download&id=1snlugarW4D_cgN7OF-VLyt-yUNt6bNoe" \
            -o Manifestacao-complementar-EMAL-Luciano-Bianchi.docx
          curl -fL --retry 3 --connect-timeout 15 -A "Mozilla/5.0" \
            "https://drive.google.com/uc?export=download&id=1KWRDzyd7yM48FUKebxlSroUgZPtl9ft_" \
            -o Manifestacao-complementar-EMAL-Luciano-Bianchi.pdf
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          docx = Path('Manifestacao-complementar-EMAL-Luciano-Bianchi.docx')
          pdf = Path('Manifestacao-complementar-EMAL-Luciano-Bianchi.pdf')
          if docx.stat().st_size < 15000 or pdf.stat().st_size < 15000:
              raise RuntimeError('Download pequeno demais: validar acesso aos arquivos originais')
          with ZipFile(docx) as z:
              assert z.testzip() is None, 'Arquivo Word corrompido'
              xml = z.read('word/document.xml')
              assert b'document' in xml, 'Word sem documento interno'
          assert pdf.open('rb').read(4) == b'%PDF', 'PDF invalido'
          print('Documentos verificados:',docx.stat().st_size,pdf.stat().st_size)
          PY
      - name: Commit e push da defesa
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clientes/luciano-664/Manifestacao-complementar-EMAL-Luciano-Bianchi.docx clientes/luciano-664/Manifestacao-complementar-EMAL-Luciano-Bianchi.pdf
          if ! git diff --cached --quiet; then
            git commit -m "docs(bianchi): publicar defesa EMAL final com Word e PDF"
            git push
          fi
